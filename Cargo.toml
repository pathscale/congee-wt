[package]
name = "congee-wt"
version = "0.4.5"
edition = "2024"
description = "A Rust implementation of ART-OLC concurrent adaptive radix tree."
keywords = ["ART", "adaptive-radix-tree", "concurrent"]
repository = "https://github.com/pathscale/congee-wt"
readme = "README.md"
authors = ["Xiangpeng Hao <haoxiangpeng123@gmail.com>"]
license = "MIT"

[lib]
name = "congee"
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["fuzz"]

[dependencies]
ps-reclaim = { version = "0.1.4", default-features = false, features = ["libc", "spin"] }
serde = { version = "1.0.219", default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
tracing-subscriber = "0.3"
rand = "0.8.5"
shumai = "0.2.16"
serde = "1.0.219"
serde_json = "1.0.143"
flurry = "0.5.2"
dashmap = "6.1.0"
mimalloc = { version = "0.1.48", default-features = false }
selfsimilar = "0.1.0"
shuttle = "0.8.1"
ahash = "0.8.12"

[[bench]]
name = "basic"
path = "bench/basic.rs"
harness = false

[[bench]]
name = "scan"
path = "bench/scan.rs"
harness = false

[[bench]]
name = "node_size"
path = "bench/node_size.rs"
harness = false

[[bench]]
name = "compact_set"
path = "bench/compact_set.rs"
harness = false

[features]
default = ["std"]
# Off, this crate does not link `std`. What it costs: `debug_print`, which needs
# somewhere to print to, and `thread::yield_now` in the spin backoff, which
# falls back to a spin because there is no scheduler to yield to.
std = ["ps-reclaim/std", "serde?/std"]
flamegraph = ["shumai/flamegraph"]
perf = ["shumai/perf"]
stats = ["serde"]
access-stats = []
shuttle = []

[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
