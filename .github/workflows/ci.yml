name: congee

on:
  push:
    branches:
      - master
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      deep_checks:
        description: Run sanitizers, Shuttle, benchmarks and one-hour fuzz targets
        required: false
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Setup toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Check
      run: cargo clippy --all-features -- -D warnings
  
  no_std:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sh scripts/check-no-std.sh -p congee-wt --lib --no-default-features
      - run: NO_STD_TARGET=x86_64-pc-windows-gnu sh scripts/check-no-std.sh -p congee-wt --lib --no-default-features

  fmt:
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Setup toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Format check
      run: cargo fmt --all -- --check

  test_sans:
    if: github.event_name == 'workflow_dispatch' && inputs.deep_checks
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Setup toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: nightly
        components: rust-src
    - name: Install llvm-dev
      run: sudo apt install llvm-dev 
    - name: Run cargo test
      run: cargo test
    - name: Run address sanitizer tests
      run: |
        env ASAN_OPTIONS="detect_odr_violation=0" RUSTFLAGS="-Z sanitizer=address" \
        cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --tests
    - name: Run memory sanitizer tests
      run: |
        env RUSTFLAGS="-Z sanitizer=memory" \
        cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --tests
  
  shuttle:
    if: github.event_name == 'workflow_dispatch' && inputs.deep_checks
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Setup toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: nightly
        components: rust-src
    - name: Shuttle concurrent insert read
      run: cargo test --features "shuttle" shuttle_concurrent_insert_read --release -- --nocapture
    - name: Shuttle insert only
      run: cargo test --features "shuttle" shuttle_insert_only --release -- --nocapture
    - name: congee_arc
      run: cargo test --features "shuttle" shuttle_get_insert_race --release -- --nocapture
    - name: Shuttle scan insert race
      run: cargo test --features "shuttle" shuttle_scan_insert_race --release -- --nocapture
 
  
  benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.deep_checks
    permissions:
      contents: write
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Setup toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
        components: rust-src
    - name: Run benchmark
      run: env SHUMAI_FILTER="ci" cargo bench --bench basic
    - uses: actions/upload-artifact@v4
      with:
        name: shumai-results 
        path: target/benchmark/**/*.json
    - name: Convert benchmark output
      run: python3 .github/workflows/shumai_converter.py
    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: 'Congee basic op performance'
        tool: 'customBiggerIsBetter'
        output-file-path: output.json
        fail-on-alert: true
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: ${{ github.event_name == 'push' }}
        alert-threshold: "1000%"
  
  fuzz:
    if: github.event_name == 'workflow_dispatch' && inputs.deep_checks
    runs-on: ubicloud-standard-4
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        target: [btree_check, compact_set_check]
    steps:
    - uses: actions/checkout@v4
    - name: Setup toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: nightly
        components: rust-src, llvm-tools-preview
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz
    - name: Ensure fresh corpus
      run: rm -rf fuzz/corpus/${{ matrix.target }} || true
    - name: Run fuzzing (${{ matrix.target }})
      run: |
        cd fuzz
        cores=$(nproc)
        cargo fuzz run ${{ matrix.target }} --release --debug-assertions -s none -- -max_total_time=3600 -fork=$cores
 
  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    needs: [check, fmt, no_std]
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish when master carries a new version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set on this repository" >&2
            exit 1
          fi

          version=$(cargo read-manifest | jq -er '.version')
          case $version in
            [0-9]*.[0-9]*) ;;
            *) echo "could not read the congee-wt version from cargo (got '$version')" >&2; exit 1 ;;
          esac

          if cargo info --registry crates-io "congee-wt@$version" >/dev/null 2>&1; then
            echo "congee-wt $version is already published; nothing to do"
            exit 0
          fi

          cargo publish -p congee-wt
