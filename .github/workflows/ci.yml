name: congee

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      deep_checks:
        description: Run sanitizers, Shuttle, benchmarks and one-hour fuzz targets
        required: false
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Setup toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Check
      run: cargo clippy --all-features -- -D warnings
  
  no_std:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sh scripts/check-no-std.sh -p congee-wt --lib --no-default-features
      - run: NO_STD_TARGET=x86_64-pc-windows-gnu sh scripts/check-no-std.sh -p congee-wt --lib --no-default-features

  fmt:
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Setup toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Format check
      run: cargo fmt --all -- --check

  test_sans:
    if: github.event_name == 'workflow_dispatch' && inputs.deep_checks
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Setup toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: nightly
        components: rust-src
    - name: Install llvm-dev
      run: sudo apt install llvm-dev 
    - name: Run cargo test
      run: cargo test
    - name: Run address sanitizer tests
      run: |
        env ASAN_OPTIONS="detect_odr_violation=0" RUSTFLAGS="-Z sanitizer=address" \
        cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --tests
    - name: Run memory sanitizer tests
      run: |
        env RUSTFLAGS="-Z sanitizer=memory" \
        cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --tests
  
  shuttle:
    if: github.event_name == 'workflow_dispatch' && inputs.deep_checks
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Setup toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: nightly
        components: rust-src
    - name: Shuttle concurrent insert read
      run: cargo test --features "shuttle" shuttle_concurrent_insert_read --release -- --nocapture
    - name: Shuttle insert only
      run: cargo test --features "shuttle" shuttle_insert_only --release -- --nocapture
    - name: congee_arc
      run: cargo test --features "shuttle" shuttle_get_insert_race --release -- --nocapture
    - name: Shuttle scan insert race
      run: cargo test --features "shuttle" shuttle_scan_insert_race --release -- --nocapture
 
  
  benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.deep_checks
    permissions:
      contents: write
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Setup toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
        components: rust-src
    - name: Run benchmark
      run: env SHUMAI_FILTER="ci" cargo bench --bench basic
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: shumai-results 
        path: target/benchmark/**/*.json
    - name: Convert benchmark output
      run: python3 .github/workflows/shumai_converter.py
    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
      with:
        name: 'Congee basic op performance'
        tool: 'customBiggerIsBetter'
        output-file-path: output.json
        fail-on-alert: true
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: ${{ github.event_name == 'push' }}
        alert-threshold: "1000%"
  
  fuzz:
    if: github.event_name == 'workflow_dispatch' && inputs.deep_checks
    runs-on: ubicloud-standard-4
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        target: [btree_check, compact_set_check]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Setup toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: nightly
        components: rust-src, llvm-tools-preview
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --version 0.13.2 --locked
    - name: Ensure fresh corpus
      run: rm -rf fuzz/corpus/${{ matrix.target }} || true
    - name: Run fuzzing (${{ matrix.target }})
      run: |
        cd fuzz
        cores=$(nproc)
        cargo fuzz run ${{ matrix.target }} --release --debug-assertions -s none -- -max_total_time=3600 -fork=$cores
 
  publish:
    # Publishing is unavailable until the approved metadata reader is provisioned and wired.
    if: ${{ false }}
    needs: [check, fmt, no_std]
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - name: Publishing unavailable
        run: exit 1
